<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orçado × Realizado — Coordenação de Logística</title>
<link rel="stylesheet" href="css/estilo.css">
</head>
<body>

<header class="topo">
  <div class="topo-texto">
    <h1 id="titulo">Orçado × Realizado</h1>
    <p class="subtitulo" id="subtitulo">Carregando…</p>
  </div>
  <div class="topo-acoes">
    <button type="button" id="btn-excel" class="botao botao-primario">Baixar Excel</button>
    <button type="button" id="btn-tema" class="botao botao-icone" aria-label="Alternar tema claro/escuro" title="Alternar tema">◐</button>
  </div>
</header>

<!-- Uma única linha de filtros, acima de tudo o que ela recorta. -->
<div class="filtros" role="group" aria-label="Filtros">
  <label class="filtro">
    <span>Período</span>
    <select id="f-periodo"></select>
  </label>
  <label class="filtro">
    <span>Grupo</span>
    <select id="f-grupo"><option value="">Todos os grupos</option></select>
  </label>
  <label class="filtro">
    <span>Conta</span>
    <select id="f-conta"><option value="">Todas as contas</option></select>
  </label>
  <label class="filtro filtro-busca">
    <span>Busca</span>
    <input type="search" id="f-busca" placeholder="conta, fornecedor, documento…">
  </label>
  <label class="filtro filtro-caixa">
    <input type="checkbox" id="f-nao-monetario" checked>
    <span>Incluir não monetário</span>
  </label>
  <button type="button" id="btn-limpar" class="botao botao-discreto">Limpar</button>
</div>

<p class="nota nota-recorte" id="nota-recorte" hidden></p>
<p class="aviso-filtro" id="aviso-filtro" hidden></p>

<nav class="abas" role="tablist" aria-label="Seções do dashboard">
  <button role="tab" class="aba" id="aba-visao" aria-controls="painel-visao" aria-selected="true">Visão geral</button>
  <button role="tab" class="aba" id="aba-contas" aria-controls="painel-contas" aria-selected="false">Contas</button>
  <button role="tab" class="aba" id="aba-lancamentos" aria-controls="painel-lancamentos" aria-selected="false">Lançamentos</button>
  <button role="tab" class="aba" id="aba-fornecedores" aria-controls="painel-fornecedores" aria-selected="false">Fornecedores</button>
  <button role="tab" class="aba" id="aba-diesel" aria-controls="painel-diesel" aria-selected="false">Diesel</button>
  <button role="tab" class="aba" id="aba-alertas" aria-controls="painel-alertas" aria-selected="false">Alertas <span class="pilula" id="pilula-alertas"></span></button>
  <button role="tab" class="aba" id="aba-dados" aria-controls="painel-dados" aria-selected="false">Dados</button>
</nav>

<main>

<!-- ───────────────────────────── VISÃO GERAL ───────────────────────────── -->
<section role="tabpanel" id="painel-visao" aria-labelledby="aba-visao">
  <div class="kpis" id="kpis"></div>

  <div class="grade grade-2">
    <figure class="cartao">
      <figcaption>
        <h2>Orçado × Realizado por mês</h2>
        <p class="legenda-texto">Meses sem planilha carregada aparecem vazios e rotulados <em>sem dados</em> — nunca como R$ 0,00.</p>
      </figcaption>
      <div class="grafico" id="g-mensal"></div>
      <details class="tabela-alternativa"><summary>Ver como tabela</summary><div id="t-g-mensal"></div></details>
    </figure>

    <figure class="cartao">
      <figcaption>
        <h2>Execução acumulada no ano</h2>
        <p class="legenda-texto">Acumulado mês a mês. A linha pontilhada projeta o fechamento somando o orçado dos meses ainda sem dados.</p>
      </figcaption>
      <div class="grafico" id="g-acumulado"></div>
      <details class="tabela-alternativa"><summary>Ver como tabela</summary><div id="t-g-acumulado"></div></details>
    </figure>

    <figure class="cartao">
      <figcaption>
        <h2>% de execução do orçado, por mês</h2>
        <p class="legenda-texto">Realizado ÷ orçado do mês. A linha em 100% é a meta.</p>
      </figcaption>
      <div class="grafico" id="g-execucao"></div>
      <details class="tabela-alternativa"><summary>Ver como tabela</summary><div id="t-g-execucao"></div></details>
    </figure>

    <figure class="cartao">
      <figcaption>
        <h2>Desvio por grupo</h2>
        <p class="legenda-texto">Realizado − orçado no período filtrado. À direita, gasto acima do previsto; à esquerda, abaixo.</p>
      </figcaption>
      <div class="grafico" id="g-desvio-grupo"></div>
      <details class="tabela-alternativa"><summary>Ver como tabela</summary><div id="t-g-desvio-grupo"></div></details>
    </figure>

    <figure class="cartao cartao-largo">
      <figcaption>
        <h2>Composição do realizado por grupo</h2>
        <p class="legenda-texto">Participação de cada grupo no total realizado do período.</p>
      </figcaption>
      <div class="grafico" id="g-composicao"></div>
      <details class="tabela-alternativa"><summary>Ver como tabela</summary><div id="t-g-composicao"></div></details>
    </figure>
  </div>

  <figure class="cartao">
    <figcaption><h2>Resumo por grupo</h2></figcaption>
    <div class="tabela-rolagem" id="t-grupos"></div>
  </figure>
</section>

<!-- ───────────────────────────── CONTAS ───────────────────────────── -->
<section role="tabpanel" id="painel-contas" aria-labelledby="aba-contas" hidden>
  <div class="grade grade-2">
    <figure class="cartao">
      <figcaption>
        <h2>Maiores contas: realizado × orçado</h2>
        <p class="legenda-texto">As 15 contas com maior realizado no período.</p>
      </figcaption>
      <div class="grafico" id="g-top-contas"></div>
      <details class="tabela-alternativa"><summary>Ver como tabela</summary><div id="t-g-top-contas"></div></details>
    </figure>

    <figure class="cartao">
      <figcaption>
        <h2>Concentração do gasto (Pareto)</h2>
        <p class="legenda-texto">Participação de cada conta e o acumulado — mostra quantas contas explicam a maior parte do gasto.</p>
      </figcaption>
      <div class="grafico" id="g-pareto"></div>
      <details class="tabela-alternativa"><summary>Ver como tabela</summary><div id="t-g-pareto"></div></details>
    </figure>
  </div>

  <figure class="cartao">
    <figcaption>
      <h2>Execução mês a mês, por conta</h2>
      <p class="legenda-texto">Realizado ÷ orçado de cada mês. Azul abaixo do orçado, vermelho acima, cinza claro sem movimento; hachurado quando o mês não tem planilha.</p>
    </figcaption>
    <div class="grafico grafico-alto" id="g-heatmap"></div>
  </figure>

  <figure class="cartao">
    <figcaption>
      <h2>Orçado × Realizado por conta</h2>
      <p class="legenda-texto">Relatório principal. Clique no cabeçalho para ordenar.</p>
    </figcaption>
    <div class="tabela-rolagem" id="t-contas"></div>
  </figure>
</section>

<!-- ───────────────────────────── LANÇAMENTOS ───────────────────────────── -->
<section role="tabpanel" id="painel-lancamentos" aria-labelledby="aba-lancamentos" hidden>
  <div class="kpis kpis-compacto" id="kpis-lancamentos"></div>

  <div class="grade grade-2">
    <figure class="cartao">
      <figcaption>
        <h2>Lançamentos por tipo de documento</h2>
        <p class="legenda-texto">Valor por origem do lançamento no ERP.</p>
      </figcaption>
      <div class="grafico" id="g-tipos"></div>
      <details class="tabela-alternativa"><summary>Ver como tabela</summary><div id="t-g-tipos"></div></details>
    </figure>

    <figure class="cartao">
      <figcaption>
        <h2 id="titulo-por-dia">Valor lançado por dia</h2>
        <p class="legenda-texto" id="legenda-por-dia">Concentração ao longo do período — normalmente revela as datas de fechamento.</p>
      </figcaption>
      <div class="grafico" id="g-por-dia"></div>
      <details class="tabela-alternativa"><summary>Ver como tabela</summary><div id="t-g-por-dia"></div></details>
    </figure>
  </div>

  <figure class="cartao">
    <figcaption>
      <h2>Maiores lançamentos individuais</h2>
    </figcaption>
    <div class="tabela-rolagem" id="t-maiores-lancamentos"></div>
  </figure>

  <figure class="cartao">
    <figcaption>
      <h2>Lançamentos detalhados</h2>
      <p class="legenda-texto" id="contagem-lancamentos"></p>
    </figcaption>
    <div class="tabela-rolagem" id="t-lancamentos"></div>
    <div class="paginacao" id="paginacao-lancamentos"></div>
  </figure>
</section>

<!-- ───────────────────────────── FORNECEDORES ───────────────────────────── -->
<section role="tabpanel" id="painel-fornecedores" aria-labelledby="aba-fornecedores" hidden>
  <div class="kpis kpis-compacto" id="kpis-fornecedores"></div>

  <div class="grade grade-2">
    <figure class="cartao">
      <figcaption>
        <h2>Maiores fornecedores</h2>
        <p class="legenda-texto">Os 15 fornecedores com maior valor no período.</p>
      </figcaption>
      <div class="grafico" id="g-top-fornecedores"></div>
      <details class="tabela-alternativa"><summary>Ver como tabela</summary><div id="t-g-top-fornecedores"></div></details>
    </figure>

    <figure class="cartao">
      <figcaption>
        <h2>Concentração de fornecedores (Pareto)</h2>
        <p class="legenda-texto">Quantos fornecedores concentram a maior parte do valor pago.</p>
      </figcaption>
      <div class="grafico" id="g-pareto-fornecedores"></div>
      <details class="tabela-alternativa"><summary>Ver como tabela</summary><div id="t-g-pareto-fornecedores"></div></details>
    </figure>
  </div>

  <figure class="cartao">
    <figcaption><h2>Fornecedores</h2></figcaption>
    <div class="tabela-rolagem" id="t-fornecedores"></div>
  </figure>
</section>

<!-- ───────────────────────────── DIESEL ───────────────────────────── -->
<section role="tabpanel" id="painel-diesel" aria-labelledby="aba-diesel" hidden>
  <p class="nota" id="nota-diesel" hidden></p>
  <div class="kpis kpis-compacto" id="kpis-diesel"></div>

  <div class="grade grade-2">
    <figure class="cartao">
      <figcaption>
        <h2>Litros atendidos por mês</h2>
        <p class="legenda-texto">Cada requisição entra no mês do seu atendimento.</p>
      </figcaption>
      <div class="grafico" id="g-litros"></div>
      <details class="tabela-alternativa"><summary>Ver como tabela</summary><div id="t-g-litros"></div></details>
    </figure>

    <figure class="cartao">
      <figcaption>
        <h2>Custo por litro</h2>
        <p class="legenda-texto">Realizado de combustível (contas 380 + 820) ÷ litros atendidos, só nos meses que têm as duas informações. Indicativo: o relatório de litros mede consumo do estoque e as contas medem a compra — veja o aviso acima.</p>
      </figcaption>
      <div class="grafico" id="g-preco-litro"></div>
      <details class="tabela-alternativa"><summary>Ver como tabela</summary><div id="t-g-preco-litro"></div></details>
    </figure>
  </div>

  <figure class="cartao">
    <figcaption><h2>Requisições de diesel</h2></figcaption>
    <div class="tabela-rolagem" id="t-diesel"></div>
    <div class="paginacao" id="paginacao-diesel"></div>
  </figure>
</section>

<!-- ───────────────────────────── ALERTAS ───────────────────────────── -->
<section role="tabpanel" id="painel-alertas" aria-labelledby="aba-alertas" hidden>
  <figure class="cartao">
    <figcaption>
      <h2>Realizado sem orçamento</h2>
      <p class="legenda-texto">Contas com gasto no período e nenhum valor orçado para os mesmos meses.</p>
    </figcaption>
    <div class="tabela-rolagem" id="t-sem-orcamento"></div>
  </figure>

  <figure class="cartao">
    <figcaption>
      <h2>Orçado sem realizado</h2>
      <p class="legenda-texto">Contas com orçamento reservado e execução praticamente nula — costuma indicar gasto classificado em outra conta.</p>
    </figcaption>
    <div class="tabela-rolagem" id="t-sem-realizado"></div>
  </figure>

  <figure class="cartao">
    <figcaption>
      <h2>Acima do orçado</h2>
      <p class="legenda-texto">Contas que passaram de 100% do orçado do período, ordenadas pelo excesso em reais.</p>
    </figcaption>
    <div class="tabela-rolagem" id="t-acima"></div>
  </figure>

  <figure class="cartao">
    <figcaption>
      <h2>Maior variação entre meses</h2>
      <p class="legenda-texto">Diferença entre o maior e o menor mês de cada conta, entre os meses com dados.</p>
    </figcaption>
    <div class="tabela-rolagem" id="t-variacao"></div>
  </figure>

  <figure class="cartao">
    <figcaption>
      <h2>Qualidade dos dados</h2>
      <p class="legenda-texto">Conciliação de cada planilha: total do centro de custo × soma das contas × soma dos lançamentos.</p>
    </figcaption>
    <div class="tabela-rolagem" id="t-qualidade"></div>
  </figure>
</section>

<!-- ───────────────────────────── DADOS ───────────────────────────── -->
<section role="tabpanel" id="painel-dados" aria-labelledby="aba-dados" hidden>
  <figure class="cartao">
    <figcaption>
      <h2>Adicionar planilhas</h2>
      <p class="legenda-texto">
        Arraste os <code>.xlsx</code> de <strong>inversão gerencial</strong> ou de <strong>consumo de diesel</strong>.
        Eles entram na análise na hora e ficam salvos neste navegador.
        Para que quem abrir o link também veja, coloque o arquivo em <code>planilhas/</code>,
        rode <code>python atualizar.py</code> e publique.
      </p>
    </figcaption>
    <div class="area-solta" id="area-solta" tabindex="0" role="button"
         aria-label="Selecionar planilhas para adicionar">
      <p><strong>Arraste aqui</strong> ou clique para escolher os arquivos</p>
      <p class="legenda-texto">Somente <code>.xlsx</code>. O orçamento (<code>.xls</code>) é lido pelo script <code>atualizar.py</code>.</p>
      <input type="file" id="entrada-arquivo" accept=".xlsx" multiple hidden>
    </div>
    <div id="retorno-upload" class="retorno" aria-live="polite"></div>
  </figure>

  <figure class="cartao">
    <figcaption>
      <h2>Planilhas carregadas</h2>
    </figcaption>
    <div class="tabela-rolagem" id="t-arquivos"></div>
    <div class="acoes-linha">
      <button type="button" id="btn-limpar-enviados" class="botao botao-discreto">Remover todos os arquivos enviados</button>
      <button type="button" id="btn-baixar-dados" class="botao botao-discreto">Baixar dados.js (para publicar)</button>
    </div>
  </figure>

  <figure class="cartao">
    <figcaption>
      <h2>Como publicar no GitHub Pages</h2>
    </figcaption>
    <ol class="passos">
      <li>Coloque as novas planilhas em <code>planilhas/inversoes/</code> (ou <code>planilhas/diesel/</code>).</li>
      <li>Rode <code>python atualizar.py</code>. Ele confere a conciliação e regrava <code>js/dados.js</code>.</li>
      <li><code>git add -A &amp;&amp; git commit -m "dados de agosto" &amp;&amp; git push</code>.</li>
      <li>No GitHub: <em>Settings → Pages → Source: branch main, pasta / (root)</em>.</li>
    </ol>
  </figure>
</section>

</main>

<footer class="rodape">
  <span id="rodape-texto"></span>
</footer>

<div class="dica" id="dica" role="tooltip" aria-hidden="true"></div>

<script src="js/dados.js"></script>
<script src="js/graficos.js"></script>
<script src="js/xlsx.js"></script>
<script src="js/leitor.js"></script>
<script src="js/app.js"></script>
</body>
</html>
